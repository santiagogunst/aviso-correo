name: aviso-correo
on:
  schedule:
    - cron: "*/15 * * * *"  # respaldo; el disparo principal es cron-job.org
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aviso-correo
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Revisar casilla y avisar por Telegram
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 aviso_nube.py
      - name: Guardar estado (solo el número del último mail avisado)
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "aviso-bot"; git config user.email "aviso-bot@users.noreply.github.com"
            git add state.json && git commit -qm "estado" && git push -q
          fi
